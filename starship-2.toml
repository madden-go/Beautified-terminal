format = "$custom$username$hostname$directory$git_branch$git_status$character"

add_newline = false

[custom.venv]
command = 'basename "$VIRTUAL_ENV"'
when = '[ -n "$VIRTUAL_ENV" ]'
format = '\([$output](default)\) '
style = "default"
shell = ["bash", "--noprofile", "--norc"]

[username]
style_user = "default"
style_root = "default"
format = "[$user]($style)"
show_always = true

[hostname]
ssh_only = false
format = "[@$hostname ]($style)"
style = "default"
trim_at = ""

[directory]
format = "[$path]($style) "
style = "default"
truncation_length = 1
truncate_to_repo = false
fish_style_pwd_dir_length = 0

[directory.substitutions]
"Documents"        = "docs"
"Downloads"        = "dl"
"Desktop/projects" = "proj"
"Desktop"          = "desk"

[git_branch]
format = "on [$branch]($style) "
style = "default"
symbol = ""

[git_status]
format = "($conflicted$modified$staged$deleted$untracked$ahead_behind )"
style = "default"
conflicted = "! "
ahead = "↑${count} "
behind = "↓${count} "
diverged = "↕${ahead_count}↓${behind_count} "
untracked = "?${count} "
stashed = ""
modified = "~${count} "
staged = "+${count} "
renamed = ""
deleted = "x${count} "
ignore_submodules = false

[character]
success_symbol = "[%](default)"
error_symbol = "[%](default)"
format = "$symbol "

